# reel rustfmt configuration — per bose-style §1.
#
# Tooling: rustfmt 1.9.0-stable (rustc 1.95.0). Run before every commit.
#
# Stable-only settings ONLY. Three nightly settings from bose-style
# (`group_imports = "StdExternalCrate"`, `imports_granularity = "Module"`,
# `overflow_delimited_expr = true`) are intentionally omitted — they
# warn on stable rustfmt and silently ignore. Re-enable once they
# stabilise. ADR-0014 + reel-tooling-decisions A8 forbid nightly default.

edition              = "2024"
max_width            = 100
use_small_heuristics = "Max"

newline_style                = "Unix"
hard_tabs                    = false
tab_spaces                   = 4
match_block_trailing_comma   = false
condense_wildcard_suffixes   = true
struct_field_align_threshold = 0   # never auto-align — keeps diffs minimal
