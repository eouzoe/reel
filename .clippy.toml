# reel clippy thresholds — per bose-style §9.
#
# Effective with `cargo clippy --workspace -- -D warnings -W clippy::pedantic`
# (the workspace `[lints]` block in Cargo.toml already opts every member in).

cognitive-complexity-threshold = 25
too-many-arguments-threshold   = 7
type-complexity-threshold      = 250
single-char-binding-names-threshold = 4
