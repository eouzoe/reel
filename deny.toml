# reel cargo-deny configuration.
#
# Per ADR-0013 (supply-chain policy) + reel-tooling-decisions.md §C.
# CI invokes: `cargo deny check bans licenses sources advisories`.
#
# Philosophy: strict on copyleft + sources + advisories; loose on
# version-multiples (workspace inherent), strict on yanked.

[graph]
all-features = false
no-default-features = false
# Targets we ship; ignore deps that only build for other targets.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[output]
feature-depth = 1

# ──────────────────────────────────────────────────────────────────────
# advisories — RustSec database
# ──────────────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # Add CVE IDs here only with documented justification.
]

# ──────────────────────────────────────────────────────────────────────
# licenses — whitelist
# ──────────────────────────────────────────────────────────────────────
[licenses]
version = 2
confidence-threshold = 0.92
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
# Per-crate clarifications (when license string is ambiguous).
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ──────────────────────────────────────────────────────────────────────
# bans — per-crate policy
# ──────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Crates explicitly forbidden in reel.
deny = [
    # OpenSSL: prefer rustls. Add when discovered transitively.
    # { name = "openssl-sys" },
]
# Crates that may appear multiple times legitimately.
skip = []
skip-tree = []

# ──────────────────────────────────────────────────────────────────────
# sources — only crates.io + GitHub + local-path allowed
# ──────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Add specific GitHub orgs / repos as needed.
    # "https://github.com/strukto-ai/",
]

[sources.allow-org]
github = ["strukto-ai"]
